[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  ELEVENTY_ENV = "production"

# Deploy Previews and branch deploys render drafts and future-dated posts
# so they can be reviewed before they go live.
[context.deploy-preview.environment]
  ELEVENTY_ENV = "preview"

[context.branch-deploy.environment]
  ELEVENTY_ENV = "preview"

# Umami Cloud analytics, proxied through our own domain so the tracker is
# first-party (keeps CSP at 'self' and avoids ad-blocker blocklists).
[[redirects]]
  from = "/stats/script.js"
  to = "https://cloud.umami.is/script.js"
  status = 200
  force = true

[[redirects]]
  from = "/stats/api/send"
  to = "https://cloud.umami.is/api/send"
  status = 200
  force = true
