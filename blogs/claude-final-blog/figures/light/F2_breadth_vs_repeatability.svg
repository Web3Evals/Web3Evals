  <g id="text_22">
   <text style="fill: #52514e; font: 10px 'Arial', 'Helvetica Neue', 'Helvetica', 'DejaVu Sans'" transform="translate(32.04 55.159687)">C8 finds the most distinct bugs but rarely the same one twice; C3 finds fewer, and finds them again.</text>
   <text style="fill: #52514e; font: 10px 'Arial', 'Helvetica Neue', 'Helvetica', 'DejaVu Sans'" transform="translate(32.04 67.455937)">Marker size ∝ as-sent prompt tokens. Co-located conditions share a marker.</text>
  </g>
  <g id="text_23">
   <text style="fill: #8a8985; font: 8px 'Arial', 'Helvetica Neue', 'Helvetica', 'DejaVu Sans'; text-anchor: start" x="25.2" y="498.78825" transform="rotate(-0 25.2 498.78825)">deepseek-v4-flash-0731 · 3 repositories × 3 replicates per condition · 27 consolidated golden bug groups · readjudication full-text + recovery arm</text>
  </g>
 </g>
