<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#121110" />

    <title>Web3Evals — Independent evaluations for Web3</title>
    <meta
      name="description"
      content="Independent, reproducible evaluations of LLMs and agentic systems on original, real-world Web3 security tasks. First release: SCAR."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.web3evals.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Web3Evals" />
    <meta property="og:title" content="Web3Evals — Independent evaluations for Web3" />
    <meta
      property="og:description"
      content="Measuring LLMs and agentic systems on original, real-world Web3 security tasks."
    />
    <meta property="og:url" content="https://www.web3evals.com/" />
    <meta property="og:image" content="https://www.web3evals.com/images/og-2.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Web3Evals — Coming soon" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Web3Evals — Independent evaluations for Web3" />
    <meta
      name="twitter:description"
      content="Measuring LLMs and agentic systems on original, real-world Web3 security tasks."
    />
    <meta name="twitter:image" content="https://www.web3evals.com/images/og-2.png" />

    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/fonts/instrument-serif-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/site.css" />
    <script src="/js/main.js" defer></script>
  </head>

  <body>
    <div class="grain" aria-hidden="true"></div>

    <header class="site-header reveal reveal-frame">
      <a class="brand" href="/" aria-label="Web3Evals home">
        <span class="brand-mark" aria-hidden="true"><span></span></span>
        <span>Web3Evals</span>
      </a>
    </header>

    <main class="site-main" id="main">
      <p class="badge reveal reveal-badge">
        <span class="badge-dot" aria-hidden="true"></span>
        First release · SCAR v1
      </p>

      <h1 class="headline reveal reveal-headline">Coming <em>soon.</em></h1>

      <p class="subline reveal reveal-subline">
        Measuring LLMs on original, real-world Web3 security tasks.
      </p>

      <form
        class="waitlist reveal reveal-form"
        name="waitlist"
        method="POST"
        action="/"
        data-netlify="true"
        netlify-honeypot="bot-field"
      >
        <input type="hidden" name="form-name" value="waitlist" />
        <p class="honeypot" aria-hidden="true">
          <label
            >Don’t fill this out if you’re human:
            <input name="bot-field" tabindex="-1" autocomplete="off"
          /></label>
        </p>
        <label class="visually-hidden" for="email">Email address</label>
        <div class="pill">
          <input
            id="email"
            name="email"
            type="email"
            required
            placeholder="you@example.com"
            autocomplete="email"
            inputmode="email"
          />
          <button type="submit">Notify me</button>
        </div>
        <p class="form-microcopy">One email when results go live. No spam.</p>
        <p class="form-status" role="status" aria-live="polite" hidden></p>
      </form>
    </main>

    <footer class="site-footer reveal reveal-frame">
      <p class="footer-copy">© <span data-year>2026</span> Web3Evals</p>
      <nav class="footer-links" aria-label="Footer">
        <a href="https://github.com/web3evals">GitHub</a>
        <span class="footer-sep" aria-hidden="true">·</span>
        <a href="mailto:contact@web3evals.com">Email</a>
      </nav>
    </footer>
  </body>
</html>
