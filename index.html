<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171717" />

    <title>Web3Evals — Coming Soon</title>
    <meta
      name="description"
      content="Measuring LLMs on original, real-world Web3 security tasks. First release: SCAR. Join the waitlist."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.web3evals.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Web3Evals" />
    <meta property="og:title" content="Web3Evals — Coming Soon" />
    <meta
      property="og:description"
      content="Measuring LLMs on original, real-world Web3 security tasks. First release: SCAR."
    />
    <meta property="og:url" content="https://www.web3evals.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Web3Evals — Coming Soon" />
    <meta
      name="twitter:description"
      content="Measuring LLMs on original, real-world Web3 security tasks. First release: SCAR."
    />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23171717'/%3E%3Ccircle cx='16' cy='16' r='11.5' fill='none' stroke='%23FAFAFA' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%23FAFAFA'/%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;family=Space+Grotesk:wght@400;500;600&amp;display=swap"
    />

    <style>
      :root {
        color-scheme: dark;
        --bg: #171717;
        --fg: #fafafa;
        --dim: #a3a3a3;
        --faint: #737373;
        --line: rgba(255, 255, 255, 0.16);
        --line-soft: rgba(255, 255, 255, 0.08);
        --accent: #fafafa;
        --accent-soft: rgba(255, 255, 255, 0.4);
        --accent-ink: #0a0a0a;
        --error: #d9a6a6;
        --sans: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 320px;
        margin: 0;
        background: var(--bg);
      }

      body {
        color: var(--fg);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      [hidden] {
        display: none !important;
      }

      ::selection {
        background: #fafafa;
        color: #0a0a0a;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      /* ── Fixed backdrop layers ─────────────────────────────── */

      #field {
        position: fixed;
        inset: 0;
        z-index: 0;
        display: block;
        opacity: 0;
        transition: opacity 1.6s ease;
      }

      #field.on {
        opacity: 1;
      }

      .shade {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: radial-gradient(120% 90% at 50% 42%, transparent 55%, rgba(0, 0, 0, 0.35) 100%);
      }

      .noise {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        opacity: 0.03;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.85'/%3E%3C/svg%3E");
      }

      .frame {
        position: fixed;
        inset: 18px;
        z-index: 3;
        pointer-events: none;
        border: 1px solid var(--line-soft);
      }

      .frame-corner {
        position: absolute;
        width: 22px;
        height: 22px;
      }

      .frame-corner::before,
      .frame-corner::after {
        position: absolute;
        background: var(--line);
        content: "";
      }

      .frame-corner::before {
        width: 22px;
        height: 1px;
      }

      .frame-corner::after {
        width: 1px;
        height: 22px;
      }

      .corner-tl {
        top: -1px;
        left: -1px;
      }

      .corner-tr {
        top: -1px;
        right: -1px;
        transform: rotate(90deg);
      }

      .corner-br {
        right: -1px;
        bottom: -1px;
        transform: rotate(180deg);
      }

      .corner-bl {
        bottom: -1px;
        left: -1px;
        transform: rotate(270deg);
      }

      /* ── Page structure ────────────────────────────────────── */

      .scene {
        position: relative;
        z-index: 5;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100svh;
      }

      .top {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        padding: 42px 52px 0;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        color: var(--fg);
        font-size: 0.88rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        text-decoration: none;
      }

      .brand-mark {
        position: relative;
        display: block;
        width: 26px;
        height: 26px;
        border: 1px solid rgba(250, 250, 250, 0.85);
        border-radius: 50%;
      }

      .brand-mark::after {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--fg);
        transform: translate(-50%, -50%);
        content: "";
      }

      .telemetry {
        display: grid;
        grid-template-columns: auto auto;
        gap: 5px 18px;
        margin: 0;
        font-family: var(--mono);
        font-size: 0.6rem;
        line-height: 1.1;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .telemetry dt {
        color: var(--faint);
      }

      .telemetry dd {
        margin: 0;
        color: var(--dim);
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      /* ── Hero ──────────────────────────────────────────────── */

      .hero {
        position: relative;
        display: flex;
        flex: 1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        padding: 64px 28px;
        text-align: center;
      }

      .hero > :not(.dial) {
        position: relative;
        z-index: 1;
      }

      /* Instrument dial — faint gauge ticks + slow accent needle */

      .dial {
        position: absolute;
        top: 50%;
        left: 50%;
        width: min(88vw, 640px);
        aspect-ratio: 1;
        border-radius: 50%;
        pointer-events: none;
        transform: translate(-50%, -50%);
      }

      .dial::before,
      .dial::after {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        content: "";
      }

      .dial::before {
        background: repeating-conic-gradient(
          rgba(250, 250, 250, 0.14) 0deg 0.45deg,
          transparent 0.45deg 6deg
        );
        -webkit-mask: radial-gradient(closest-side, transparent 0 88%, #000 88% 96%, transparent 96%);
        mask: radial-gradient(closest-side, transparent 0 88%, #000 88% 96%, transparent 96%);
      }

      .dial::after {
        background: repeating-conic-gradient(
          rgba(250, 250, 250, 0.26) 0deg 0.55deg,
          transparent 0.55deg 30deg
        );
        -webkit-mask: radial-gradient(closest-side, transparent 0 85%, #000 85% 100%, transparent 100%);
        mask: radial-gradient(closest-side, transparent 0 85%, #000 85% 100%, transparent 100%);
      }

      .needle-wrap {
        position: absolute;
        inset: 0;
        transform: rotate(215deg);
        animation: sweep 60s linear infinite;
      }

      @keyframes sweep {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }

      .needle {
        position: absolute;
        top: -5%;
        left: calc(50% - 0.5px);
        width: 1px;
        height: 55%;
        background: linear-gradient(
          to bottom,
          rgba(250, 250, 250, 0.55) 0%,
          rgba(250, 250, 250, 0.28) 55%,
          rgba(250, 250, 250, 0) 92%
        );
      }

      .overline {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin: 0;
        color: var(--dim);
        font-family: var(--mono);
        font-size: 0.66rem;
        letter-spacing: 0.32em;
        text-transform: uppercase;
      }

      .pulse-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 10px rgba(250, 250, 250, 0.45);
        animation: pulse 2.4s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: 0.35;
        }
      }

      .headline {
        margin: 30px 0 0;
        padding-left: 0.14em;
        font-size: clamp(3rem, 9.5vw, 7.6rem);
        font-weight: 500;
        line-height: 1.08;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .headline span {
        display: block;
      }

      .hero .accent {
        color: var(--accent);
      }

      .sub {
        max-width: 46ch;
        margin: 28px 0 0;
        color: var(--dim);
        font-size: clamp(0.95rem, 0.85rem + 0.4vw, 1.12rem);
        font-weight: 400;
        line-height: 1.6;
        letter-spacing: 0.01em;
        text-wrap: balance;
      }

      /* ── Waitlist form ─────────────────────────────────────── */

      .waitlist {
        width: min(480px, 100%);
        margin: 52px 0 0;
      }

      .hp {
        position: absolute;
        left: -9999px;
        margin: 0;
        opacity: 0;
      }

      .field-row {
        display: flex;
        gap: 10px;
      }

      .field-row input[type="email"] {
        flex: 1;
        min-width: 0;
        height: 50px;
        padding: 0 16px;
        border: 1px solid #404040;
        border-radius: 6px;
        background: #1c1c1c;
        color: var(--fg);
        font-family: var(--mono);
        font-size: 1rem;
        transition: border-color 180ms ease, background 180ms ease;
      }

      .field-row input[type="email"]::placeholder {
        color: var(--faint);
      }

      .field-row input[type="email"]:focus {
        outline: none;
        border-color: var(--accent-soft);
        background: #1f1f1f;
      }

      .field-row input[type="email"]:focus-visible {
        border-color: var(--accent);
      }

      .field-row button {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        height: 50px;
        padding: 0 22px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: var(--accent-ink);
        font-family: var(--mono);
        font-size: 0.68rem;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background 180ms ease, transform 120ms ease;
      }

      .field-row button:hover {
        background: #e5e5e5;
      }

      .field-row button:active {
        transform: translateY(1px);
      }

      .field-row button:focus-visible {
        outline: 1px solid var(--fg);
        outline-offset: 2px;
      }

      .field-row button:disabled {
        opacity: 0.55;
        cursor: default;
        transform: none;
      }

      .form-msg {
        margin: 18px 0 0;
        color: var(--error);
        font-family: var(--mono);
        font-size: 0.72rem;
        letter-spacing: 0.1em;
      }

      .form-msg.ok {
        color: var(--fg);
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .form-msg .sq {
        color: var(--accent);
        margin-right: 8px;
      }

      .form-note {
        margin: 20px 0 0;
        color: #969696;
        font-family: var(--mono);
        font-size: 0.62rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      /* ── Footer ────────────────────────────────────────────── */

      .bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 52px 42px;
        font-family: var(--mono);
        font-size: 0.6rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--faint);
      }

      .foot-right {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      .foot-right a {
        color: var(--dim);
        text-decoration: none;
        transition: color 160ms ease;
      }

      .foot-right a:hover,
      .foot-right a:focus-visible {
        color: var(--fg);
      }

      .foot-right a:focus-visible {
        outline: 1px solid var(--accent-soft);
        outline-offset: 3px;
      }

      .foot-right .sep {
        color: var(--faint);
      }

      /* ── Entrance ──────────────────────────────────────────── */

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }

        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes fadein {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      .overline,
      .headline,
      .sub,
      .waitlist,
      .form-note {
        animation: rise 0.9s cubic-bezier(0.2, 0.6, 0.2, 1) both;
      }

      .dial {
        animation: fadein 1.6s ease 0.1s both;
      }

      .overline {
        animation-delay: 0.08s;
      }

      .headline {
        animation-delay: 0.16s;
      }

      .sub {
        animation-delay: 0.24s;
      }

      .waitlist {
        animation-delay: 0.32s;
      }

      .form-note {
        animation-delay: 0.4s;
      }

      /* ── Responsive ────────────────────────────────────────── */

      @media (max-width: 720px) {
        .frame {
          inset: 12px;
        }

        .top {
          padding: 28px 30px 0;
        }

        .telemetry {
          font-size: 0.55rem;
        }

        .hero {
          padding: 56px 22px;
        }

        .waitlist {
          margin-top: 44px;
        }

        .field-row {
          flex-direction: column;
        }

        .field-row button {
          justify-content: center;
        }

        .bottom {
          flex-direction: column;
          gap: 12px;
          padding: 0 30px 32px;
        }

        .foot-right {
          order: 1;
        }

        .foot-left {
          order: 2;
        }
      }

      @media (max-width: 400px) {
        .brand {
          font-size: 0.8rem;
        }

        .telemetry {
          grid-template-columns: auto;
          gap: 4px;
        }

        .telemetry dt {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .pulse-dot,
        .dial,
        .needle-wrap,
        .overline,
        .headline,
        .sub,
        .waitlist,
        .form-note {
          animation: none;
        }

        #field {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <canvas id="field" aria-hidden="true"></canvas>
    <div class="shade" aria-hidden="true"></div>
    <div class="noise" aria-hidden="true"></div>

    <div class="frame" aria-hidden="true">
      <span class="frame-corner corner-tl"></span>
      <span class="frame-corner corner-tr"></span>
      <span class="frame-corner corner-br"></span>
      <span class="frame-corner corner-bl"></span>
    </div>

    <main class="scene">
      <header class="top">
        <a class="brand" href="/" aria-label="Web3Evals home">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>Web3Evals</span>
        </a>

        <dl class="telemetry" aria-hidden="true">
          <dt>Status</dt>
          <dd>Calibrating</dd>
          <dt>UTC</dt>
          <dd id="clock">--:--:--</dd>
        </dl>
      </header>

      <section class="hero" aria-labelledby="page-title">
        <div class="dial" aria-hidden="true">
          <div class="needle-wrap"><span class="needle"></span></div>
        </div>

        <p class="overline">
          <span class="pulse-dot" aria-hidden="true"></span>
          First release &middot; SCAR v1
        </p>

        <h1 class="headline" id="page-title">
          <span>Coming</span>
          <span>Soon</span>
        </h1>

        <p class="sub">
          Measuring LLMs on original, real-world Web3 security tasks<span class="accent">.</span>
        </p>

        <form
          class="waitlist"
          name="waitlist"
          method="POST"
          action="/"
          data-netlify="true"
          netlify-honeypot="bot-field"
        >
          <input type="hidden" name="form-name" value="waitlist" />

          <p class="hp" aria-hidden="true">
            <label>
              Don’t fill this out if you’re human:
              <input name="bot-field" tabindex="-1" autocomplete="off" />
            </label>
          </p>

          <div class="field-row">
            <label class="sr-only" for="email">Email address</label>
            <input
              id="email"
              type="email"
              name="email"
              required
              placeholder="you@example.com"
              autocomplete="email"
              inputmode="email"
            />
            <button type="submit">
              <span class="btn-label">Notify me</span>
              <span aria-hidden="true">→</span>
            </button>
          </div>

          <p class="form-msg" role="status" aria-live="polite" hidden></p>
        </form>

        <p class="form-note">One email when results go live. No spam.</p>
      </section>

      <footer class="bottom">
        <span class="foot foot-left">&copy; 2026 Web3Evals</span>
        <nav class="foot foot-right" aria-label="Links">
          <a href="https://github.com/web3evals">GitHub</a>
          <span class="sep" aria-hidden="true">&middot;</span>
          <a href="mailto:contact@web3evals.com">Email</a>
        </nav>
      </footer>
    </main>

    <script>
      /* UTC clock */
      (() => {
        const el = document.getElementById("clock");
        if (!el) return;
        const pad = (n) => String(n).padStart(2, "0");
        const tick = () => {
          const d = new Date();
          el.textContent =
            pad(d.getUTCHours()) + ":" + pad(d.getUTCMinutes()) + ":" + pad(d.getUTCSeconds());
        };
        tick();
        setInterval(tick, 1000);
      })();

      /* Ambient field — drifting specks + occasional scanline sweep */
      (() => {
        const canvas = document.getElementById("field");
        const ctx = canvas.getContext("2d");
        if (!ctx) return;

        const reduced = window.matchMedia("(prefers-reduced-motion: reduce)");
        const SCAN_PERIOD = 14000;
        const SCAN_DURATION = 2600;

        let width = 0;
        let height = 0;
        let dpr = 1;
        let specks = [];
        let raf = 0;
        let start = performance.now();
        let lastScan = start - (SCAN_PERIOD - 4000);

        const seed = () => {
          const count = Math.round((window.innerWidth * window.innerHeight) / 15000);
          specks = Array.from({ length: count }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            r: (Math.random() * 0.9 + 0.5) * dpr,
            a: Math.random() * 0.2 + 0.05,
            p: Math.random() * Math.PI * 2,
            s: (Math.random() * 0.06 + 0.02) * dpr,
          }));
        };

        const resize = () => {
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          width = canvas.width = Math.round(window.innerWidth * dpr);
          height = canvas.height = Math.round(window.innerHeight * dpr);
          canvas.style.width = window.innerWidth + "px";
          canvas.style.height = window.innerHeight + "px";
          seed();
        };

        const draw = (now) => {
          ctx.clearRect(0, 0, width, height);
          const t = (now - start) / 1000;
          const still = reduced.matches;

          for (const k of specks) {
            if (!still) {
              k.y -= k.s;
              k.x += k.s * 0.35;
              if (k.y < -4) {
                k.y = height + 4;
                k.x = Math.random() * width;
              }
              if (k.x > width + 4) k.x = -4;
            }
            const twinkle = still ? 1 : 0.65 + 0.35 * Math.sin(t * 0.8 + k.p);
            ctx.globalAlpha = k.a * twinkle;
            ctx.fillStyle = "rgb(250,250,250)";
            ctx.fillRect(k.x, k.y, k.r, k.r);
          }

          if (!still) {
            const dt = now - lastScan;
            if (dt > SCAN_PERIOD) {
              lastScan = now;
            } else if (dt < SCAN_DURATION) {
              const y = (dt / SCAN_DURATION) * height;
              const span = 40 * dpr;
              const g = ctx.createLinearGradient(0, y - span, 0, y + span);
              g.addColorStop(0, "rgba(250,250,250,0)");
              g.addColorStop(0.5, "rgba(250,250,250,0.05)");
              g.addColorStop(1, "rgba(250,250,250,0)");
              ctx.globalAlpha = 1;
              ctx.fillStyle = g;
              ctx.fillRect(0, y - span, width, span * 2);
            }
          }

          ctx.globalAlpha = 1;
        };

        const loop = (now) => {
          draw(now);
          raf = requestAnimationFrame(loop);
        };

        const run = () => {
          cancelAnimationFrame(raf);
          if (reduced.matches) {
            draw(performance.now());
          } else {
            raf = requestAnimationFrame(loop);
          }
          canvas.classList.add("on");
        };

        window.addEventListener(
          "resize",
          () => {
            resize();
            if (reduced.matches) draw(performance.now());
          },
          { passive: true },
        );

        document.addEventListener("visibilitychange", () => {
          if (document.hidden) {
            cancelAnimationFrame(raf);
          } else {
            run();
          }
        });

        if (typeof reduced.addEventListener === "function") {
          reduced.addEventListener("change", run);
        }

        resize();
        run();
      })();

      /* Waitlist — AJAX submit to Netlify Forms, inline success state */
      (() => {
        const form = document.querySelector(".waitlist");
        if (!form) return;

        const row = form.querySelector(".field-row");
        const msg = form.querySelector(".form-msg");
        const note = document.querySelector(".form-note");
        const button = form.querySelector("button");
        const label = button.querySelector(".btn-label");

        form.addEventListener("submit", async (event) => {
          event.preventDefault();

          button.disabled = true;
          label.textContent = "Sending…";
          msg.hidden = true;

          try {
            const body = new URLSearchParams(new FormData(form)).toString();
            const res = await fetch("/", {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body,
            });
            if (!res.ok) throw new Error("HTTP " + res.status);

            row.hidden = true;
            if (note) note.hidden = true;
            msg.classList.add("ok");
            msg.innerHTML =
              '<span class="sq" aria-hidden="true">▪</span>Registered — you’re on the list.';
            msg.hidden = false;
          } catch (_) {
            button.disabled = false;
            label.textContent = "Notify me";
            msg.classList.remove("ok");
            msg.textContent = "Something went wrong — please try again.";
            msg.hidden = false;
          }
        });
      })();
    </script>
  </body>
</html>
